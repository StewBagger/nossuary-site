  <!-- The Chamberlain's deep intake (js/forum/page-intake.js), served by the FORUM Worker: the
       questions, their helper lines, the per-answer limit and the consent text all come from
       GET /v1/intake and none of them is written into this page. The question text is a storage
       key on the far side, so a copy here would be a copy that can drift.
       Everything the API returns is rendered with textContent; nothing is ever inserted as HTML.
       connect-src must name the origin of forumApiUrl in js/config.js (tests/intake.test.mjs
       checks it). -->
  <!-- A member-only form, not content: never indexed, and deliberately not in sitemap.xml. -->
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://nossuary-forum.stewbagger.workers.dev; img-src 'self' https://cdn.discordapp.com data:; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">

  <meta name="description" content="The Chamberlain's deep intake, for members of the Null Ossuary Discord.">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="stylesheet" href="/css/style.css?v=20261008-1">
  <!-- ?v= is the forum surface's build stamp: this page loads forum modules, so it is bumped with
       them — in every forums/**/index.html, every import in js/forum/*.js and here (the stamp test
       in tests/forum.test.mjs and tests/intake.test.mjs fail if any of them disagree). -->
  <script src="/js/config.js?v=20261008-1" defer></script>
  <script type="module" src="/js/forum/page-intake.js?v=20261008-1"></script>

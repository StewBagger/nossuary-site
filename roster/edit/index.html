<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- A member's own WoW: Forever roster registration (js/forum/page-roster-edit.js), served by the
       FORUM Worker — not the status Worker that /roster/ reads. Identity already lives in the forum
       (its sessions, its membership re-check, its Discord application), so the roster's member-facing
       routes live there too; a second OAuth flow would be a second thing to get wrong.

       NO WOW GAME DATA IS WRITTEN INTO THIS PAGE OR ITS MODULE. Every faction, race, class, talent
       tree and profession comes from the `options` document GET /v1/roster/me serves, and nothing
       here judges whether a choice is legal: chamberlain/wow_forever.py is the single validator
       (Discord-Automation DR-0017). `options: null` means the pick-lists are not published yet, and
       the page says so rather than drawing empty menus.

       A SUBMISSION IS ASYNCHRONOUS. POST /v1/roster/me answers 202 and the registration does not
       change until Chamberlain claims it, validates it and pushes a new mirror back, so the page
       says "queued" and never "saved".

       Everything the API returns is rendered with textContent; nothing is ever inserted as HTML.
       connect-src must name the origin of forumApiUrl in js/config.js (tests/roster-edit.test.mjs
       checks it). -->
  <!-- A member-only form, not content: never indexed, and deliberately not in sitemap.xml. -->
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://nossuary-forum.stewbagger.workers.dev; img-src 'self' https://cdn.discordapp.com data:; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="theme-color" content="#0b0d0c">
  <title>Your roster registration · WoW: Forever · Null Ossuary</title>
  <meta name="description" content="Add or change your own WoW: Forever roster registration, for members of the Null Ossuary Discord.">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="stylesheet" href="/css/style.css?v=20261008-1">
  <!-- ?v= is the FORUM surface's build stamp, not /roster/'s: this page loads js/forum modules, so
       it is bumped with them — in every forums/**/index.html, every import in js/forum/*.js, and
       here (the stamp tests in tests/intake.test.mjs and tests/roster-edit.test.mjs fail if any of
       them disagree). /roster/ keeps its own stamp because it loads js/roster.js and talks to the
       status Worker; it shares no code with this page. -->
  <script src="/js/config.js?v=20261008-1" defer></script>
  <script type="module" src="/js/forum/page-roster-edit.js?v=20261008-1"></script>
</head>

    <nav aria-label="Primary">

        <li><a href="/#contact">Contact</a></li>
        <li><a href="https://discord.gg/PtMaTp385b" target="_blank" rel="noopener">Discord</a></li>
        <li class="nav-session" id="forum-session" aria-live="polite"></li>
      </ul>
    </nav>
  </header>
  <div class="forum-note" id="forum-note" role="status" hidden></div>

  <main class="forum-page">
    <div class="forum-hero forum-hero-slim" aria-hidden="true"></div>
    <div class="wrap forum-wrap">
      <p class="forum-status" id="forum-status" role="alert" hidden></p>
      <div id="forum-main" aria-busy="true">
        <p class="forum-loading"><span class="dot" aria-hidden="true"></span>Loading your registration…</p>
        <noscript><p class="forum-noscript">This form needs JavaScript: your registration and every
          choice in it are fetched rather than written into this page. Turn it on and reload — or
          register in the Null Ossuary Discord instead, which does the same thing one step at a
          time.</p></noscript>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <span class="brand">
        <img src="/assets/emblem-256.webp" alt="" width="28" height="28" loading="lazy">

      </span>
      <span class="muted small">Your roster registration · <a href="/">nossuary.com</a> · <a href="/roster/">the public roster</a> · You are counted by default and named only if you ask to be.</span>
